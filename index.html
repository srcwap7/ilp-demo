<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Yard Designer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #EEF2F6;
    --bg-grid: #D7E1EC;
    --surface: #FFFFFF;
    --surface-2: #F5F8FB;
    --border: #C7D2DE;
    --text: #16233A;
    --text-dim: #5B6B84;
    --accent: #3452B4;
    --accent-contrast: #FFFFFF;
    --warn: #B5760B;
    --danger: #C23B32;
    --ok: #1F8A5F;
    --node-induction: #2F63D0;
    --node-feeder: #0E8F86;
    --node-backbone: #0B6E68;
    --node-sorter: #7C5CD1;
    --node-diverter: #C98A1B;
    --node-chute: #2E9F5D;
    --shadow: 0 1px 2px rgba(22,35,58,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0D1117;
      --bg-grid: #1B222B;
      --surface: #151B23;
      --surface-2: #1A222C;
      --border: #2A3441;
      --text: #E4E9EF;
      --text-dim: #8B98AA;
      --accent: #6C8CFF;
      --accent-contrast: #0D1117;
      --warn: #E8A33D;
      --danger: #E2574C;
      --ok: #45C08A;
      --node-induction: #5B8DEF;
      --node-feeder: #34C7BC;
      --node-backbone: #2A9791;
      --node-sorter: #A98BF0;
      --node-diverter: #E8A33D;
      --node-chute: #52C97C;
      --shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0D1117;
    --bg-grid: #1B222B;
    --surface: #151B23;
    --surface-2: #1A222C;
    --border: #2A3441;
    --text: #E4E9EF;
    --text-dim: #8B98AA;
    --accent: #6C8CFF;
    --accent-contrast: #0D1117;
    --warn: #E8A33D;
    --danger: #E2574C;
    --ok: #45C08A;
    --node-induction: #5B8DEF;
    --node-feeder: #34C7BC;
    --node-backbone: #2A9791;
    --node-sorter: #A98BF0;
    --node-diverter: #E8A33D;
    --node-chute: #52C97C;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  #root { height: 100%; display: flex; flex-direction: column; }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

  button {
    font-family: inherit;
    cursor: pointer;
  }
  input, select, textarea, button { font-family: inherit; font-size: 13px; }

  /* ---------- header ---------- */
  .app-header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand-title { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .brand-sub { color: var(--text-dim); font-size: 12px; }
  .header-spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.2;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.subtle { background: transparent; }
  .btn.icon { padding: 7px 9px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- layout ---------- */
  .app-body { flex: 1; display: flex; min-height: 0; position: relative; }
  .rail {
    flex: 0 0 auto;
    background: var(--surface);
    border-color: var(--border);
    overflow-y: auto;
  }
  .rail.left { width: 216px; border-right: 1px solid var(--border); }
  .rail.right { width: 320px; border-left: 1px solid var(--border); }
  .rail-section { padding: 14px; border-bottom: 1px solid var(--border); }
  .rail-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 0 0 10px; font-weight: 600; }

  .palette-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-2);
    margin-bottom: 8px;
    cursor: grab;
    user-select: none;
  }
  .palette-item:active { cursor: grabbing; }
  .palette-stage {
    width: 18px; height: 18px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    flex: 0 0 auto;
  }
  .palette-label { font-size: 13px; font-weight: 500; }
  .palette-hint { font-size: 11px; color: var(--text-dim); line-height: 1.4; margin-top: 2px; }

  .canvas-wrap { flex: 1; position: relative; overflow: hidden; display: flex; }
  .canvas-viewport {
    flex: 1;
    overflow: auto;
    position: relative;
    background-image: radial-gradient(var(--bg-grid) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    background-color: var(--bg);
  }
  .canvas-world {
    position: relative;
  }
  .canvas-world.connecting { cursor: crosshair; }

  .node-card {
    position: absolute;
    border-radius: 8px;
    border: 1.5px solid var(--card-color, var(--border));
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: visible;
  }
  .node-card.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
  .node-head {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    cursor: grab;
    border-radius: 7px 7px 0 0;
  }
  .node-head:active { cursor: grabbing; }
  .node-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--card-color); flex: 0 0 auto; }
  .node-id { font-size: 11px; font-weight: 600; }
  .node-label { font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-worker-tag { font-size: 10px; color: var(--text-dim); padding: 0 10px 8px; margin-top: -4px; }

  .port {
    position: absolute;
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    cursor: pointer;
    transform: translate(-50%, -50%);
    z-index: 3;
  }
  .port:hover { transform: translate(-50%, -50%) scale(1.25); }
  .port.out { background: var(--card-color); }
  .port.in { background: var(--surface); border-color: var(--card-color); border-width: 2.5px; }
  @media (prefers-reduced-motion: no-preference) {
    .port.eligible { animation: portPulse 1.1s ease-in-out infinite; }
  }
  @keyframes portPulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); }
  }

  .sorter-body { padding: 6px 0 8px; }
  .diverter-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px 5px 14px;
    margin: 0 8px;
    border-radius: 5px;
    cursor: pointer;
    position: relative;
  }
  .diverter-row:hover { background: var(--surface-2); }
  .diverter-row.selected { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .diverter-swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--node-diverter); flex: 0 0 auto; }
  .diverter-id { font-size: 11px; flex: 1; }
  .diverter-del {
    border: none; background: transparent; color: var(--text-dim);
    font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 4px;
  }
  .diverter-del:hover { color: var(--danger); background: var(--surface-2); }
  .add-diverter-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px 5px 14px; margin: 2px 8px 0;
    font-size: 11px; color: var(--accent); border-radius: 5px;
    background: transparent; border: none; width: calc(100% - 16px); text-align: left;
  }
  .add-diverter-row:hover { background: var(--surface-2); }

  svg.edge-layer { position: absolute; inset: 0; overflow: visible; }
  .edge-path { fill: none; stroke-width: 2; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .edge-path.selected { stroke-width: 3; }
  .edge-temp { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }

  /* ---------- inspector ---------- */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab-btn {
    flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-dim);
    font-size: 12.5px; font-weight: 600; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .field input[type=text], .field input[type=number], .field select {
    width: 100%; padding: 7px 8px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--surface); color: var(--text);
  }
  .field-row { display: flex; gap: 8px; }
  .field-row > .field { flex: 1; }
  .radio-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; color: #fff;
  }
  .empty-note { color: var(--text-dim); font-size: 12.5px; line-height: 1.6; padding: 14px; }
  .assign-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .assign-table th { text-align: left; color: var(--text-dim); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .assign-table td { padding: 5px 4px; border-bottom: 1px solid var(--surface-2); }
  .assign-table select { width: 100%; padding: 4px; font-size: 12px; }
  .summary-line { font-size: 12.5px; line-height: 1.6; padding: 10px 12px; background: var(--surface-2); border-radius: 6px; margin-bottom: 12px; }
  .warn-banner {
    font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 12px;
    background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); line-height: 1.5;
  }

  /* ---------- center column: canvas + ask panel ---------- */
  .center-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .center-col .canvas-wrap { min-height: 0; }
  .ask-panel {
    flex: 0 0 auto; max-height: 45%; overflow-y: auto;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 16px;
  }
  .ask-title { font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 0 0 8px; }
  .ask-row { display: flex; gap: 8px; align-items: flex-start; }
  .ask-row textarea {
    flex: 1; min-height: 56px; resize: vertical; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); line-height: 1.45;
  }
  .ask-answer {
    margin-top: 10px; padding: 10px 12px; border-radius: 6px;
    background: var(--surface-2); font-size: 13px; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .ask-answer.error { color: var(--danger); }
  .ask-answer.pending { color: var(--text-dim); }
  .port-field { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-dim); }
  .port-field input {
    width: 64px; padding: 6px 6px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); color: var(--text);
  }
  .field input.invalid, .assign-table input.invalid { border-color: var(--danger); }
  .assign-table input {
    width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface); color: var(--text); font-size: 12px;
  }
  .field-hint { font-size: 11px; color: var(--text-dim); line-height: 1.4; margin: 0 0 10px; }

  /* ---------- footer / status ---------- */
  .status-bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 16px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 12px; color: var(--text-dim);
  }
  .status-count { display: flex; align-items: center; gap: 5px; }
  .status-spacer { flex: 1; }
  .issue-chip { border: none; background: transparent; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 5px; }
  .issue-chip.err { color: var(--danger); }
  .issue-chip.warn { color: var(--warn); }
  .issue-chip.ok { color: var(--ok); }

  .issues-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    max-height: 220px; overflow-y: auto;
    background: var(--surface); border-top: 1px solid var(--border);
    box-shadow: 0 -6px 16px rgba(0,0,0,0.12);
  }
  .issue-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px; font-size: 12.5px; border-bottom: 1px solid var(--surface-2);
  }
  .issue-row:hover { background: var(--surface-2); cursor: pointer; }
  .issue-icon { flex: 0 0 auto; font-weight: 700; }
  .issue-icon.error { color: var(--danger); }
  .issue-icon.warning { color: var(--warn); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 9px 16px; border-radius: 7px; font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    z-index: 50; max-width: min(90vw, 420px); text-align: center;
  }
  .toast.error { background: var(--danger); color: #fff; }
  .toast.ok { background: var(--ok); color: #fff; }

  .file-input { display: none; }

  /* ---------- responsive ---------- */
  .mobile-toggle { display: none; }
  @media (max-width: 900px) {
    .mobile-toggle { display: inline-flex; }
    .rail.left, .rail.right {
      position: absolute; top: 0; bottom: 0; z-index: 10;
      box-shadow: 0 0 24px rgba(0,0,0,0.25);
    }
    .rail.left { left: 0; transform: translateX(-100%); transition: transform 0.18s ease; }
    .rail.left.open { transform: translateX(0); }
    .rail.right { right: 0; transform: translateX(100%); transition: transform 0.18s ease; }
    .rail.right.open { transform: translateX(0); }
    .brand-sub { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function () {
  "use strict";
  var h = React.createElement;
  var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo,
      useRef = React.useRef, useCallback = React.useCallback;

  /* ============================================================
     CONSTANTS + PURE LOGIC (mirrors logic.js, unit-tested there)
     ============================================================ */
  var NODE_TYPES = {
    INDUCTION: { label: "Induction Station", prefix: "IS", stage: 1, next: "FEEDER", colorVar: "--node-induction" },
    FEEDER: { label: "Feeder Conveyor", prefix: "FC", stage: 2, next: "BACKBONE", colorVar: "--node-feeder" },
    BACKBONE: { label: "Backbone Conveyor", prefix: "BB", stage: 3, next: "SORTER", colorVar: "--node-backbone" },
    SORTER: { label: "Sorter", prefix: "SRT", stage: 4, next: null, colorVar: "--node-sorter" },
    DIVERTER: { label: "Diverter", prefix: "DV", stage: 5, next: "CHUTE", colorVar: "--node-diverter" },
    CHUTE: { label: "Chute", prefix: "CH", stage: 6, next: null, colorVar: "--node-chute" }
  };
  var PALETTE_TYPES = ["INDUCTION", "FEEDER", "BACKBONE", "SORTER", "CHUTE"];

  var STD_W = 168, STD_H = 64, SORTER_W = 236, HEADER_H = 44, CHIP_H = 30,
      PAD_TOP = 6, PAD_BOTTOM = 8, ADD_ROW_H = 28;
  var WORLD_W = 2600, WORLD_H = 1500;

  function nextIdFromNodes(type, nodes) {
    var prefix = NODE_TYPES[type].prefix;
    var max = 0;
    Object.keys(nodes).forEach(function (k) {
      if (k.indexOf(prefix) === 0) {
        var n = parseInt(k.slice(prefix.length), 10);
        if (!isNaN(n) && n > max) max = n;
      }
    });
    return prefix + String(max + 1).padStart(3, "0");
  }

  function canConnect(nodesById, fromId, toId) {
    if (fromId === toId) return { ok: false, reason: "Can't connect a node to itself." };
    var from = nodesById[fromId], to = nodesById[toId];
    if (!from || !to) return { ok: false, reason: "Unknown node." };
    var expected = NODE_TYPES[from.type].next;
    if (!expected) return { ok: false, reason: NODE_TYPES[from.type].label + " has no outgoing connections." };
    if (to.type !== expected) {
      return { ok: false, reason: NODE_TYPES[from.type].label + " can only connect to " + NODE_TYPES[expected].label + "." };
    }
    return { ok: true };
  }

  function addEdge(edges, fromId, toId) {
    var id = fromId + "->" + toId;
    if (edges.some(function (e) { return e.id === id; })) return edges;
    return edges.concat([{ id: id, from: fromId, to: toId }]);
  }

  function removeNode(nodes, edges, id) {
    var toRemove = { };
    toRemove[id] = true;
    if (nodes[id] && nodes[id].type === "SORTER") {
      Object.keys(nodes).forEach(function (k) {
        if (nodes[k].parentId === id) toRemove[k] = true;
      });
    }
    var newNodes = {};
    Object.keys(nodes).forEach(function (k) { if (!toRemove[k]) newNodes[k] = nodes[k]; });
    var newEdges = edges.filter(function (e) { return !toRemove[e.from] && !toRemove[e.to]; });
    return { nodes: newNodes, edges: newEdges };
  }

  function validateGraph(nodes, edges) {
    var issues = [];
    var nodeList = Object.keys(nodes).map(function (k) { return nodes[k]; });
    var outCount = {}, inCount = {};
    edges.forEach(function (e) {
      outCount[e.from] = (outCount[e.from] || 0) + 1;
      inCount[e.to] = (inCount[e.to] || 0) + 1;
    });
    nodeList.forEach(function (n) {
      var t = n.type;
      if (t === "INDUCTION" && !(outCount[n.id] > 0)) {
        issues.push({ level: "warning", nodeId: n.id, message: n.id + " (induction station) doesn't feed any conveyor yet." });
      }
      if (t === "FEEDER") {
        if (!(inCount[n.id] > 0)) issues.push({ level: "warning", nodeId: n.id, message: n.id + " (feeder) has no induction station feeding it." });
        if (!(outCount[n.id] > 0)) issues.push({ level: "warning", nodeId: n.id, message: n.id + " (feeder) doesn't feed a backbone conveyor yet." });
      }
      if (t === "BACKBONE") {
        if (!(inCount[n.id] > 0)) issues.push({ level: "warning", nodeId: n.id, message: n.id + " (backbone) has no feeder conveyor connected." });
        if (!(outCount[n.id] > 0)) issues.push({ level: "warning", nodeId: n.id, message: n.id + " (backbone) doesn't feed a sorter yet." });
      }
      if (t === "SORTER") {
        if (!(inCount[n.id] > 0)) issues.push({ level: "warning", nodeId: n.id, message: n.id + " (sorter) has no backbone conveyor connected." });
        var diverters = nodeList.filter(function (d) { return d.parentId === n.id; });
        if (diverters.length === 0) issues.push({ level: "warning", nodeId: n.id, message: n.id + " (sorter) has no diverters yet." });
      }
      if (t === "DIVERTER") {
        if (!(outCount[n.id] > 0)) issues.push({ level: "error", nodeId: n.id, message: n.id + " (diverter) isn't connected to a chute." });
        if (outCount[n.id] > 1) issues.push({ level: "error", nodeId: n.id, message: n.id + " (diverter) is connected to more than one chute." });
      }
      if (t === "CHUTE") {
        if (!(inCount[n.id] > 0)) issues.push({ level: "error", nodeId: n.id, message: n.id + " (chute) has no diverter feeding it." });
        if (inCount[n.id] > 1) issues.push({ level: "error", nodeId: n.id, message: n.id + " (chute) is fed by more than one diverter." });
      }
    });
    return issues;
  }

  /* ============================================================
     API ENDPOINTS, RULES, AND PAYLOAD HELPERS
     ============================================================ */
  var API_PATH_DESIGN = "/api/yard-desing";   // spelled as specified; change here if the server uses "yard-design"
  var API_PATH_QUESTION = "/api/question";

  function zoneOf(node) { return node && node.zone ? String(node.zone).trim() : ""; }
  function validCount(v) { return typeof v === "number" && isFinite(v) && v >= 1 && Math.floor(v) === v; }
  function validCapacity(v) { return typeof v === "number" && isFinite(v) && v > 0; }
  function toCount(v) { return typeof v === "number" && isFinite(v) && v > 0 ? Math.floor(v) : 0; }

  // Working copy of the worker settings. It may keep a draft for each mode so
  // switching tabs doesn't lose typing, but it is NEVER what gets exported.
  function normalizeWorkers(raw) {
    raw = raw || {};
    var mode = raw.mode === "manual" ? "zone" : raw.mode;
    if (mode !== "split" && mode !== "zone") mode = "total";
    var perZone = {};
    if (raw.perZone && typeof raw.perZone === "object") {
      Object.keys(raw.perZone).forEach(function (z) {
        var key = String(z).trim(), src = raw.perZone[z];
        if (!key || !src || typeof src !== "object") return;
        var entry = {};
        ["inductionCount", "chuteCount"].forEach(function (f) {
          if (typeof src[f] === "number" && isFinite(src[f])) entry[f] = src[f];
        });
        perZone[key] = entry;
      });
    }
    return {
      mode: mode, total: toCount(raw.total),
      inductionCount: toCount(raw.inductionCount), chuteCount: toCount(raw.chuteCount),
      perZone: perZone

  }

  // Strict, per-mode shape used for export / register:
  //   total -> { mode, total }
  //   split -> { mode, inductionCount, chuteCount }
  //   zone  -> { mode, perZone }   (perZone[zone] holds only the role(s) present in that zone)
  function cleanWorkers(workers, nodes) {
    if (workers.mode === "total") return { mode: "total", total: toCount(workers.total) };
    if (workers.mode === "split") {
      return { mode: "split", inductionCount: toCount(workers.inductionCount), chuteCount: toCount(workers.chuteCount) };
    }
    var perZone = {}, src = workers.perZone || {};
    Object.keys(nodes).forEach(function (id) {
      var n = nodes[id], z = zoneOf(n);
      if (!z || (n.type !== "INDUCTION" && n.type !== "CHUTE")) return;
      var field = n.type === "INDUCTION" ? "inductionCount" : "chuteCount";
      if (!perZone[z]) perZone[z] = {};
      perZone[z][field] = toCount((src[z] || {})[field]);
    });
    return { mode: "zone", perZone: perZone };
  }

  // Rules that go beyond graph wiring: chute capacity, zone exclusivity, zone-mode completeness.
  function validateRules(nodes, workers) {
    var issues = [];
    var list = Object.keys(nodes).map(function (k) { return nodes[k]; });
    var inductions = list.filter(function (n) { return n.type === "INDUCTION"; });
    var chutes = list.filter(function (n) { return n.type === "CHUTE"; });

    chutes.forEach(function (c) {
      if (!validCapacity(c.capacity)) {
        issues.push({ level: "error", nodeId: c.id, message: c.id + " (chute) needs a capacity greater than 0." });
      }
    });

    var byZone = {};
    function bucket(z) { return byZone[z] || (byZone[z] = { i: [], c: [] }); }
    inductions.forEach(function (n) { var z = zoneOf(n); if (z) bucket(z).i.push(n.id); });
    chutes.forEach(function (n) { var z = zoneOf(n); if (z) bucket(z).c.push(n.id); });

    Object.keys(byZone).forEach(function (z) {
      var b = byZone[z];
      if (b.i.length && b.c.length) {
        issues.push({ level: "error", nodeId: b.c[0],
          message: "Zone " + z + " can't hold both induction stations (" + b.i.join(", ") + ") and chutes (" + b.c.join(", ") + ")." });
      }
    });

    if (workers.mode === "zone") {
      inductions.concat(chutes).forEach(function (n) {
        if (!zoneOf(n)) {
          issues.push({ level: "error", nodeId: n.id,
            message: n.id + " (" + NODE_TYPES[n.type].label.toLowerCase() + ") needs a zone \u2014 workers are assigned per zone." });
        }
      });
      var perZone = workers.perZone || {};
      Object.keys(byZone).forEach(function (z) {
        var b = byZone[z], zc = perZone[z] || {};
        if (b.i.length && !validCount(zc.inductionCount)) {
          issues.push({ level: "error", nodeId: b.i[0], message: "Zone " + z + ": enter the number of induction workers (a whole number, at least 1)." });
        }
        if (b.c.length && !validCount(zc.chuteCount)) {
          issues.push({ level: "error", nodeId: b.c[0], message: "Zone " + z + ": enter the number of chute workers (a whole number, at least 1)." });
        }
      });
    }
    return issues;
  }

  // Turns a payload (the same shape export produces) into editor state. Returns null if it isn't one.
  function docFromPayload(data) {
    if (!data || typeof data !== "object" || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) return null;
    var nodes = {};
    data.nodes.forEach(function (n) {
      if (!n || !n.id || !NODE_TYPES[n.type]) return;
      var cap = n.capacity === null || n.capacity === undefined || n.capacity === "" ? null : Number(n.capacity);
      nodes[n.id] = {
        id: n.id, type: n.type, label: n.label || (NODE_TYPES[n.type].label + " " + n.id),
        zone: n.zone ? String(n.zone).trim() : "", parentId: n.parentId || null,
        x: typeof n.x === "number" ? n.x : (n.type === "DIVERTER" ? undefined : 0),
        y: typeof n.y === "number" ? n.y : (n.type === "DIVERTER" ? undefined : 0),
        capacity: cap === null || isNaN(cap) ? null : cap
      };
    });
    var edges = data.edges.filter(function (e) { return e && nodes[e.from] && nodes[e.to]; })
      .map(function (e) { return { id: e.from + "->" + e.to, from: e.from, to: e.to }; });
    return { nodes: nodes, edges: edges, workers: data.workers ? normalizeWorkers(data.workers) : null };
  }

  function roundRobinAssign(workerIds, nodeIds) {
    var assignments = {};
    if (workerIds.length === 0) {
      nodeIds.forEach(function (nid) { assignments[nid] = null; });
      return assignments;
    }
    nodeIds.forEach(function (nid, i) { assignments[nid] = workerIds[i % workerIds.length]; });
    return assignments;
  }

  function computeAutoAssignments(mode, opts, inductionNodeIds, chuteNodeIds) {
    var inductionPool = [], chutePool = [], w = 1, i;
    if (mode === "total") {
      var total = Math.max(0, opts.total | 0);
      var nInduction = Math.floor(total / 2);
      var nChute = total - nInduction;
      for (i = 0; i < nInduction; i++, w++) inductionPool.push("W" + String(w).padStart(3, "0"));
      for (i = 0; i < nChute; i++, w++) chutePool.push("W" + String(w).padStart(3, "0"));
    } else if (mode === "split") {
      var nI = Math.max(0, opts.inductionCount | 0);
      var nC = Math.max(0, opts.chuteCount | 0);
      for (i = 0; i < nI; i++, w++) inductionPool.push("W" + String(w).padStart(3, "0"));
      for (i = 0; i < nC; i++, w++) chutePool.push("W" + String(w).padStart(3, "0"));
    }
    var inductionAssign = roundRobinAssign(inductionPool, inductionNodeIds);
    var chuteAssign = roundRobinAssign(chutePool, chuteNodeIds);
    var assignments = {};
    Object.keys(inductionAssign).forEach(function (k) { assignments[k] = inductionAssign[k]; });
    Object.keys(chuteAssign).forEach(function (k) { assignments[k] = chuteAssign[k]; });
    return { inductionPool: inductionPool, chutePool: chutePool, assignments: assignments };
  }

  // Zone-scoped assignment (mode "zone"): group induction/chute nodes by
  // their zone string ("" = unzoned, grouped and labeled separately), then
  // round-robin a per-zone worker pool across only that zone's nodes. Worker
  // IDs are handed out with one running counter across all zones/roles, so
  // pools never overlap and the same worker can never end up covering both
  // an induction node and a chute node.
  function groupIdsByZone(nodes, ids) {
    var groups = {};
    ids.forEach(function (id) {
      var zone = zoneOf(nodes[id]);
      if (!groups[zone]) groups[zone] = [];
      groups[zone].push(id);
    });
    return groups;
  }

  function computeZoneAssignments(nodes, workers, inductionNodeIds, chuteNodeIds) {
    var inductionGroups = groupIdsByZone(nodes, inductionNodeIds);
    var chuteGroups = groupIdsByZone(nodes, chuteNodeIds);
    var zoneSet = {};
    Object.keys(inductionGroups).forEach(function (z) { zoneSet[z] = true; });
    Object.keys(chuteGroups).forEach(function (z) { zoneSet[z] = true; });
    var zones = Object.keys(zoneSet).sort(function (a, b) {
      if (a === "") return 1;
      if (b === "") return -1;
      return a < b ? -1 : a > b ? 1 : 0;
    });

    var assignments = {}, breakdown = [], counter = 1;
    function makePool(n) {
      var arr = [];
      for (var i = 0; i < n; i++, counter++) arr.push("W" + String(counter).padStart(3, "0"));
      return arr;
    }
    var perZone = workers.perZone || {};
    zones.forEach(function (zone) {
      var iIds = inductionGroups[zone] || [];
      var cIds = chuteGroups[zone] || [];
      // nodes without a zone get no workers (they're flagged as errors in zone mode)
      var zc = zone === "" ? {} : (perZone[zone] || {});
      var iPool = makePool(iIds.length ? toCount(zc.inductionCount) : 0);
      var cPool = makePool(cIds.length ? toCount(zc.chuteCount) : 0);
      var iAssign = roundRobinAssign(iPool, iIds);
      var cAssign = roundRobinAssign(cPool, cIds);
      Object.keys(iAssign).forEach(function (k) { assignments[k] = iAssign[k]; });
      Object.keys(cAssign).forEach(function (k) { assignments[k] = cAssign[k]; });
      breakdown.push({
        zone: zone === "" ? "(no zone)" : zone, zoneKey: zone,
        inductionWorkers: iPool.length, inductionNodes: iIds.length,
        chuteWorkers: cPool.length, chuteNodes: cIds.length

  function nodeWidth(node) { return node.type === "SORTER" ? SORTER_W : STD_W; }

      var idx = divs.findIndex(function (d) { return d.id === node.id; });
      var y = sorter.y + HEADER_H + PAD_TOP + idx * CHIP_H + CHIP_H / 2;

    return { x: node.x + w, y: node.y + STD_H / 2 };

    return { x: node.x, y: node.y + STD_H / 2 };
  }

      var errs = issues.filter(function (i) { return i.level === "error"; });
      if (errs.length === 0) return true;
      setIssuesOpen(true);
      showToast("Fix " + errs.length + " error" + (errs.length === 1 ? "" : "s") + " before " + actionLabel + " \u2014 see the issue list.", "error");
      return false;
    }

    function applyDoc(doc) {
      setNodes(doc.nodes); setEdges(doc.edges);
      if (doc.workers) setWorkers(doc.workers);
      setSelection(null);
    }

    function handleRegister() {
      if (registering || !guardErrors("registering")) return;
      setRegistering(true);
      fetch(apiBase + API_PATH_DESIGN, {
        method: "POST",
        headers: { "Content-Type": "application/json",  "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify(buildExportPayload())
      })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          showToast("Design registered.", "ok");
        })
        .catch(function (err) {
          showToast("Couldn't register the design (" + (err && err.message ? err.message : "network error") + ").", "error");
        })
        .then(function () { setRegistering(false); });
    }

    function handleExport() {
      if (!guardErrors("exporting")) return;
      var json = JSON.stringify(buildExportPayload(), null, 2);
      (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null))
        .then(function (downloads) {
          if (!downloads) {
            console.log(json);
            showToast("Downloads aren't available here \u2014 logged the JSON to the browser console instead.", "error");
            return;
          }
          return downloads.save({ filename: "parcel-yard-config.json", data: json })
            .then(function (res) { showToast(res.status === "saved" ? "Config saved." : "Config delivered.", "ok"); });
        })
        .catch(function (err) {
          var code = err && err.code;
          if (code === "declined") return;
          showToast("Couldn't save the file (" + (code || "unknown error") + ").", "error");
        });
    }

    function handleImportFile(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result));
          if (data.format !== "parcel-yard-config" || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) {
            showToast("That file doesn't look like a Yard Designer config.", "error");
            return;
          }
          var doc = docFromPayload(data);
          if (!doc) { showToast("That file doesn't have any nodes or edges.", "error"); return; }
          applyDoc(doc);
          showToast("Config imported.", "ok");
        } catch (err) {
          showToast("Couldn't read that file as JSON.", "error");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    return h("div", { style: { height: "100%", display: "flex", flexDirection: "column" } },
      h("header", { className: "app-header" },
        h("div", { className: "brand" },
          h("span", { style: { fontSize: 18 } }, "\uD83D\uDCE6"),
          h("span", { className: "brand-title" }, "Yard Designer"),
          h("span", { className: "brand-sub" }, "sketch a sortation layout, wire it up, staff it")
        ),
        h("span", { className: "header-spacer" }),
        h("button", { className: "btn subtle", onClick: loadExample }, "Load example"),
        h("button", { className: "btn subtle", onClick: clearCanvas }, "Clear"),
        h("button", { className: "btn subtle", onClick: function () { fileInputRef.current.click(); } }, "Import"),
        h("input", { ref: fileInputRef, type: "file", accept: "application/json", className: "file-input", onChange: handleImportFile }),
        h("button", { className: "btn", onClick: handleExport }, "Export config"),
        h("label", { className: "port-field", title: "Port of the local API server" }, "localhost:",
          h("input", { type: "number", min: 1, max: 65535, value: port, onChange: function (e) { setPort(e.target.value); } })),
        h("button", { className: "btn primary", disabled: registering, onClick: handleRegister }, registering ? "Registering\u2026" : "Register"),
        h("button", {
          className: "btn subtle icon", title: "Theme: " + theme,
          onClick: function () { setTheme(theme === "auto" ? "light" : theme === "light" ? "dark" : "auto"); }
        }, theme === "auto" ? "\u25D0" : theme === "light" ? "\u2600" : "\u25CF")
      ),
      h("div", { className: "app-body" },
        h(Palette, { open: panels.palette }),
        h("div", { className: "center-col" },
        h(Canvas, {
          nodes: nodesWithTags, edges: edges, selection: selection,
          connectFrom: connectFrom, mousePos: mousePos,
          onAddNodeAt: addNodeAt,
          onSelect: setSelection,
          onDeleteNode: deleteNode,
          onAddDiverter: addDiverter,
          onStartConnect: startConnect,
          onCompleteConnect: completeConnect,
          onCancelConnect: cancelConnect,
          onDragStart: dragStart,
          onDragMove: dragMove,
          onDragEnd: dragEnd,
          dragging: dragging,
          onMouseMoveWhileConnecting: setMousePos
        }),
        h(AskPanel, { apiBase: apiBase })
        ),
        h(Inspector, {
          open: panels.inspector, tab: tab, setTab: setTab,
          selection: selection, nodes: nodes, edges: edges,
          onUpdateNode: updateNode, onDeleteNode: deleteNode, onDeleteEdge: deleteEdge,
          workers: workers, onUpdateWorkers: updateWorkers,
          inductionNodeIds: inductionNodeIds, chuteNodeIds: chuteNodeIds,
          resolvedAssignments: resolvedAssignments, autoSummary: autoSummary
        })
      ),
      h(StatusBar, {
        nodes: nodes, issues: issues,
        onToggleIssues: function () { setIssuesOpen(!issuesOpen); },
        onTogglePalette: function () { setPanels(Object.assign({}, panels, { palette: !panels.palette })); },
        onToggleInspector: function () { setPanels(Object.assign({}, panels, { inspector: !panels.inspector })); }
      }),
      h(IssuesPanel, { open: issuesOpen, issues: issues, onSelect: setSelection }),
      h(Toast, { toast: toast })
    );
  }

  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(h(App));
})();
</script>
</body>
</html>
